<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d6b4c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bultang Asik">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d6b4c'/%3E%3Cpath d='M20 18 L32 40 L44 18 Z' fill='%23fff' opacity='.9'/%3E%3Ccircle cx='32' cy='44' r='7' fill='%23e8a317'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231d6b4c'/%3E%3Cpath d='M20 18 L32 40 L44 18 Z' fill='%23fff' opacity='.9'/%3E%3Ccircle cx='32' cy='44' r='7' fill='%23e8a317'/%3E%3C/svg%3E">
<title>Bultang Asik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column app, court cards drawn like a top-down badminton court, sticky tab bar */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --fg:#17231d; --muted:#5d6b63; --line:#dde3dc;
  --court:#1d6b4c; --court-ink:#ffffff; --court-line:rgba(255,255,255,.75);
  --accent:#e8a317; --accent-ink:#1b1405; --danger:#c2412d; --ok:#1f7a52;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Figtree",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18211c; --fg:#e7eee9; --muted:#9aa8a0; --line:#2a352f;
  --court:#1a5c42; --court-ink:#f3f8f5; --court-line:rgba(255,255,255,.55);
  --accent:#f0b43a; --accent-ink:#1b1405; --danger:#e2674f; --ok:#5fd39b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18211c; --fg:#e7eee9; --muted:#9aa8a0; --line:#2a352f;
  --court:#1a5c42; --court-ink:#f3f8f5; --court-line:rgba(255,255,255,.55);
  --accent:#f0b43a; --accent-ink:#1b1405; --danger:#e2674f; --ok:#5fd39b; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 96px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin:0;letter-spacing:.5px;text-transform:uppercase}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
h2{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:1px;margin:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ghost{background:transparent}
.danger{color:var(--danger)}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
section{display:flex;flex-direction:column;gap:14px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{font-family:var(--display);font-size:22px;min-width:20px;text-align:center}
.stepper button{width:34px;height:34px;padding:0}

/* court card */
.court{background:var(--court);color:var(--court-ink);border-radius:10px;padding:12px;position:relative}
.court-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);text-transform:uppercase;letter-spacing:1px;font-size:15px;margin-bottom:8px}
.field{border:2px solid var(--court-line);display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;min-height:110px}
.side{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:10px;min-width:0}
.side.b{text-align:right}
.net{width:0;border-left:3px dashed var(--court-line);position:relative}
.pname{font-weight:600;overflow-wrap:anywhere}
.lv{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.empty{padding:22px 10px;text-align:center;opacity:.85;grid-column:1/-1}
.score{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.score input{width:64px;text-align:center;font-family:var(--display);font-size:20px;font-weight:700}
.score .vs{font-family:var(--display);font-weight:700}
.court .primary{margin-left:auto}
.court button.ghost{color:var(--court-ink);border-color:var(--court-line)}

/* lists */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.meta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.l1{color:#2f7d5a;border-color:currentColor}
.chip.l2{color:#b07a0a;border-color:currentColor}
.chip.l3{color:var(--danger);border-color:currentColor}
.qnum{font-family:var(--display);font-weight:700;font-size:18px;width:22px;color:var(--muted);font-variant-numeric:tabular-nums}
.toggle{width:40px;height:24px;border-radius:99px;padding:0;position:relative;background:var(--line);border:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:left .15s}
.toggle[aria-pressed="true"]{background:var(--court)}
.toggle[aria-pressed="true"]::after{left:19px}
.add{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.note{color:var(--muted);font-size:13px;margin:0}
.banner{background:color-mix(in srgb,var(--accent) 18%,var(--surface));border:1px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hist-score{font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.win{font-weight:700}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* patungan */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:12px}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.form-grid input,.form-grid select{width:100%}
.kokbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-top:1px solid var(--line)}
.kokbar b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;min-width:40px;text-align:center}
.total{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.total div{background:var(--surface);padding:10px 12px;min-width:0}
.total span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.total strong{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.money{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;flex:1;padding:8px 6px;font-size:13px}
.seg{position:relative;isolation:isolate}
.seg .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n,2));border-radius:8px;background:var(--court);box-shadow:0 2px 8px color-mix(in srgb,var(--court) 35%,transparent);transform:translateX(calc(var(--i,0) * 100%));transition:transform .38s var(--ease);z-index:-1}
.seg button{background:transparent;position:relative}
.seg button[aria-pressed="true"]{color:var(--court-ink)}
.paid .grow>div:first-child{text-decoration:line-through;color:var(--muted)}
.check{width:22px;height:22px;accent-color:var(--court);flex:none}
textarea{font:inherit;font-size:13px;width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:10px}
.kokbtn{display:inline-flex;align-items:center;gap:6px}
@media (max-width:420px){.total strong{font-size:17px}}

/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs{position:relative;display:flex;width:100%;max-width:640px}
.ind{position:absolute;top:-1px;left:0;width:20%;height:3px;display:flex;justify-content:center;transform:translateX(calc(var(--i,0) * 100%));transition:transform .4s var(--ease)}
.ind::before{content:"";width:44%;height:100%;border-radius:0 0 3px 3px;background:var(--accent)}
nav button{flex:1;min-width:0;border:0;border-radius:0;background:transparent;padding:13px 2px;font-family:var(--display);font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);white-space:nowrap}
nav button[aria-selected="true"]{color:var(--fg)}
nav button:active:not(:disabled){transform:none;opacity:.7}

/* motion & polish */
:root{--ease:cubic-bezier(.22,.8,.24,1);--shadow:0 1px 2px rgba(16,40,28,.06),0 6px 18px rgba(16,40,28,.07)}
button{transition:background-color .22s var(--ease),color .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease),transform .14s var(--ease),opacity .22s;-webkit-tap-highlight-color:transparent;border-radius:10px}
button:active:not(:disabled){transform:scale(.95)}
button:disabled{opacity:.45;cursor:not-allowed}
@media (hover:hover){
  button:hover:not(:disabled){border-color:var(--muted)}
  .primary:hover:not(:disabled){border-color:var(--accent);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
  nav button:hover{color:var(--fg)}
  .list li:hover{background:color-mix(in srgb,var(--line) 35%,transparent)}
}
input,select,textarea{transition:border-color .2s var(--ease),box-shadow .2s var(--ease);border-radius:10px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--court);box-shadow:0 0 0 3px color-mix(in srgb,var(--court) 22%,transparent)}
.card,.court{border-radius:14px;box-shadow:var(--shadow)}
.total{border-radius:14px;box-shadow:var(--shadow)}
.list li{transition:background-color .25s var(--ease)}
.paid .grow>div:first-child,.grow>div{transition:color .25s var(--ease)}
.toggle{transition:background-color .25s var(--ease)}
.toggle::after{transition:left .28s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.seg{border-radius:10px}
.seg button{border-radius:0}
[data-kokcount]{display:inline-block}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:.3;transform:scale(.95)}60%{transform:scale(1.01)}100%{opacity:1;transform:none}}
@keyframes bump{40%{transform:scale(1.35)}}
section.enter>*{animation:rise .42s var(--ease) both}
section.enter>*:nth-child(2){animation-delay:.04s}
section.enter>*:nth-child(3){animation-delay:.08s}
section.enter>*:nth-child(4){animation-delay:.12s}
section.enter>*:nth-child(5){animation-delay:.16s}
section.enter>*:nth-child(n+6){animation-delay:.2s}
.court.pop{animation:pop .5s var(--ease)}
.bump{animation:bump .32s var(--ease)}
/* sync + stats */
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap;transition:color .3s var(--ease),border-color .3s var(--ease)}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background-color .3s}
.sync.live{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.sync.live::before{background:var(--ok);animation:pulse 2.2s ease-in-out infinite}
.sync.err{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.sync.err::before{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
.stat+.stat{border-top:1px solid var(--line)}
.stat summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:14px;transition:background-color .2s var(--ease)}
.stat summary::-webkit-details-marker{display:none}
.stat summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
@media (hover:hover){.stat summary:hover{background:color-mix(in srgb,var(--line) 35%,transparent)}}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px}
.bar span{display:block;height:100%;background:var(--ok);border-radius:inherit;transition:width .5s var(--ease)}
.rate{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.chev{color:var(--muted);transition:transform .25s var(--ease);font-size:13px}
.stat[open] .chev{transform:rotate(90deg)}
.stat-body{padding:0 12px 12px 44px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat[open] .stat-body{animation:rise .3s var(--ease)}
.kv{background:color-mix(in srgb,var(--line) 45%,transparent);border-radius:10px;padding:8px 10px;min-width:0}
.kv span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.kv b{font-weight:600;overflow-wrap:anywhere}
.kv small{display:block;color:var(--muted);font-size:12px}
@media (max-width:420px){.stat-body{padding-left:12px}}
.ro-note{font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
body.ro .wrap :is(button,input,select):not([data-copy]):not(.keep){opacity:.5;pointer-events:none}
/* jadwal, kas, level */
.form-grid .full{grid-column:1/-1}
.sched-sum{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.15;text-wrap:balance}
.rsvp{display:flex;gap:6px;flex:none}
.rsvp button{padding:6px 12px;font-size:13px}
.rsvp button[aria-pressed="true"][data-v="yes"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.rsvp button[aria-pressed="true"][data-v="no"]{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.kas-form{padding:12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:8px}
.kas-form .seg,.kas-form .primary{grid-column:1/-1}
.amt-in{color:var(--ok)}
.amt-out{color:var(--danger)}
.chip.up{color:var(--ok);border-color:currentColor}
.chip.down{color:var(--danger);border-color:currentColor}
.setting{display:flex;align-items:center;gap:12px;padding:12px}
.toast{position:fixed;left:50%;bottom:calc(66px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow);z-index:6;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.show{animation:toastIn .35s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Bultang <span>Asik</span></h1>
      <p class="sub">Atur pemain, bagi tim seimbang, giliran adil.</p>
    </div>
    <span id="sync" class="sync" role="status">Hanya di HP ini</span>
  </header>

  <p id="roNote" class="ro-note" hidden>Mode lihat. Database menolak perubahan, jadi kamu hanya bisa memantau antrian, skor, dan tagihan. Cek aturan Firestore di panduan.</p>

  <div id="exampleBanner" class="banner" hidden>
    <span>Ini data contoh. Hapus dan isi dengan pemainmu sendiri.</span>
    <button id="clearExample" class="ghost">Kosongkan</button>
  </div>

  <section id="tab-jadwal" hidden></section>
  <section id="tab-lapangan"></section>
  <section id="tab-pemain" hidden></section>
  <section id="tab-riwayat" hidden></section>
  <section id="tab-patungan" hidden></section>
</div>

<nav><div class="tabs" role="tablist">
  <span class="ind" aria-hidden="true" style="--i:1"></span>
  <button role="tab" data-tab="jadwal" aria-selected="false">Jadwal</button>
  <button role="tab" data-tab="lapangan" aria-selected="true">Lapangan</button>
  <button role="tab" data-tab="pemain" aria-selected="false">Pemain</button>
  <button role="tab" data-tab="riwayat" aria-selected="false">Statistik</button>
  <button role="tab" data-tab="patungan" aria-selected="false">Patungan</button>
</div></nav>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============================================================
   ISI BAGIAN INI dengan config dari Firebase Console
   (Project settings > Your apps > Web app > SDK setup and configuration > Config)
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "ISI_API_KEY",
  authDomain: "ISI_PROJECT_ID.firebaseapp.com",
  projectId: "ISI_PROJECT_ID",
  storageBucket: "ISI_PROJECT_ID.appspot.com",
  messagingSenderId: "ISI_SENDER_ID",
  appId: "ISI_APP_ID"
};
/* ============================================================ */
const KEY="smash-rotasi-v1";
const LEVELS={1:"Pemula",2:"Menengah",3:"Jago"};
const uid=()=>Math.random().toString(36).slice(2,9);

function sample(){
  const names=[["Andi",3],["Budi",2],["Citra",2],["Dewi",1],["Eko",3],["Fajar",2],["Gita",1],["Hendra",2],["Intan",3],["Joko",1]];
  const players=names.map(([n,l])=>({id:uid(),name:n,level:l,present:true,played:0,wins:0}));
  const ix=i=>players[i].id, nm=i=>players[i].name, now=Date.now();
  const games=[[[0,3],[1,2],21,17],[[4,9],[5,7],18,21],[[1,6],[8,3],21,19],[[0,7],[4,2],21,15],[[8,6],[0,5],16,21],[[2,9],[1,7],21,23]];
  const history=games.map(([a,b,sa,sb],k)=>({a:a.map(nm),b:b.map(nm),ia:a.map(ix),ib:b.map(ix),sa,sb,court:k%2+1,at:now-(k+1)*86400000/3})).reverse().sort((x,y)=>y.at-x.at);
  const sd=isoDate(new Date(now+2*86400000));
  const rsvpLocal={};players.forEach((p,i)=>{if(i<8)rsvpLocal[p.id]={v:i===5?"no":"yes",date:sd,at:now}});
  const kas={entries:[{id:uid(),at:now-6*86400000,type:"in",amount:45000,note:"Sisa kas bulan lalu"},{id:uid(),at:now-2*86400000,type:"out",amount:30000,note:"Beli minum"}],
    debts:{[players[9].id]:[{date:isoDate(new Date(now-7*86400000)),amt:25000,name:players[9].name}]}};
  return {example:true,courts:2,players,active:[],history,schedule:{date:sd,time:"19:00",place:"GOR Cempaka"},rsvpLocal,kas};
}
const BILL0={courtPrice:60000,hours:2,courtCount:2,kokPrice:9000,kok:0,mode:"rata",round:1000,paid:{},out:{}};
const HIST_MAX=300, KAS_MAX=200;
function isoDate(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function dateLabel(iso,opt){if(!iso)return "";const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("id-ID",opt||{weekday:"long",day:"numeric",month:"long"})}
function normalize(x){
  x.schedule=Object.assign({date:isoDate(new Date()),time:"19:00",place:""},x.schedule||{});
  x.rsvpLocal=x.rsvpLocal||{};
  x.kas=Object.assign({entries:[],debts:{}},x.kas||{});
  x.kas.entries=Array.isArray(x.kas.entries)?x.kas.entries:[];x.kas.debts=x.kas.debts||{};
  x.autoLevel=!!x.autoLevel;

function participants(){return S.players.filter(p=>(p.present||p.played>0)&&!S.bill.out[p.id])}
function calcBill(){
  const B=S.bill, ppl=participants();
  const court=B.courtPrice*B.hours*B.courtCount, kok=B.kokPrice*B.kok, total=court+kok;
  const games=ppl.reduce((s,p)=>s+p.played,0);
  const rows=ppl.map(p=>{
    let raw;
    if(B.mode==="main"&&games>0) raw=court/ppl.length+kok*(p.played/games);
    else raw=ppl.length?total/ppl.length:0;
    const amt=B.round>1?Math.ceil(raw/B.round)*B.round:Math.round(raw);
    return {p,amt};
  });

function save(){

async function pushRemote(){
  if(writing){writeTimer=setTimeout(pushRemote,300);return}
  writeTimer=null;
  const json=JSON.stringify(S);if(json===lastSent)return;
  writing=true;const prev=lastSent;lastSent=json;

    else{setSync("err","Gagal sinkron");setTimeout(()=>{if(docRef&&!writeTimer)writeTimer=setTimeout(pushRemote,800+Math.random()*800)},1500)}

function applyRemote(data){
  if(!data||typeof data.json!=="string"||data.json===lastSent)return;
  if(writeTimer||writing)return; // our newer local edit is about to win
  let next;try{next=JSON.parse(data.json)}catch(e){return}
  if(!next||!Array.isArray(next.players))return;
  lastSent=data.json;S=normalize(next);

async function startSync(){
  // Firebase is optional: without a filled-in config the app works on this device only
  if(!window.firebase||!FIREBASE_CONFIG||!FIREBASE_CONFIG.projectId||FIREBASE_CONFIG.projectId.startsWith("ISI_")){setSync("local");return}
  let db=null;
  try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}catch(e){setSync("err","Config Firebase salah");return}
  try{docRef=db.collection("bultang").doc("state");rsvpCol=db.collection("rsvp")}catch(e){setSync("local");return}
  // each person's RSVP is its own document, so friends answering at the same time never overwrite each other
  rsvpCol.onSnapshot(q=>{const m={};q.docs.forEach(d=>{m[d.id]=d.data()});rsvpRemote=m;render()},()=>{rsvpCol=null;rsvpRemote=null;render()});
  let first=true;
  docRef.onSnapshot(snap=>{
    if(!snap.exists){
      if(first&&canWrite&&!S.example){save()} // move this device's own data into the empty group store
      if(canWrite)setSync("live");
    }else{
      applyRemote(snap.data());

  },err=>{docRef=null;setSync("err",err&&err.code==="permission-denied"?"Akses database ditolak":"Sinkron terputus")});
}
const P=id=>S.players.find(p=>p.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function onCourt(){const s=new Set();S.active.forEach(m=>m&&[...m.a,...m.b].forEach(i=>s.add(i)));return s}
function queue(){
  const busy=onCourt();
  return S.players.filter(p=>p.present&&!busy.has(p.id))
    .sort((x,y)=>x.played-y.played||(x.lastAt||0)-(y.lastAt||0));
}
const pairKey=(x,y)=>x<y?x+"|"+y:y+"|"+x;
function pairCounts(){
  // how often two people were partners recently (last 40 matches + courts now)
  const m={},add=(x,y)=>{const k=pairKey(x,y);m[k]=(m[k]||0)+1};
  S.history.slice(0,40).forEach(r=>{if(r.ia&&r.ib){add(r.ia[0],r.ia[1]);add(r.ib[0],r.ib[1])}});
  S.active.forEach(g=>{if(g){add(g.a[0],g.a[1]);add(g.b[0],g.b[1])}});
  return m;
}
function balance(four){
  const opts=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
  const pc=pairCounts();
  let best=null,bs=1e9;
  opts.sort(()=>Math.random()-.5).forEach(([a,b])=>{
    const d=Math.abs(four[a[0]].level+four[a[1]].level-four[b[0]].level-four[b[1]].level);
    const rep=(pc[pairKey(four[a[0]].id,four[a[1]].id)]||0)+(pc[pairKey(four[b[0]].id,four[b[1]].id)]||0);
    const score=d*2+rep; // one level of imbalance weighs the same as two repeated pairings
    if(score<bs){bs=score;best=[a.map(i=>four[i].id),b.map(i=>four[i].id)]}
  });
  return best;
}
function autoLevel(ids,winners){
  if(!S.autoLevel)return [];
  const msgs=[];
  ids.forEach(id=>{
    const p=P(id);if(!p)return;
    p.lg=(p.lg||0)+1;if(winners.includes(id))p.lw=(p.lw||0)+1;
    if(p.lg<5)return;
    const rate=(p.lw||0)/p.lg;
    if(rate>=0.65&&p.level<3){p.level++;p.lvlNote={dir:"up",at:Date.now()};msgs.push(`${p.name} naik ke ${LEVELS[p.level]} ↑`)}
    else if(rate<=0.35&&p.level>1){p.level--;p.lvlNote={dir:"down",at:Date.now()};msgs.push(`${p.name} turun ke ${LEVELS[p.level]} ↓`)}
    p.lg=0;p.lw=0;
  });
  return msgs;
}
function fillCourts(){
  S.active.length=S.courts;
  for(let c=0;c<S.courts;c++){
    if(S.active[c])continue;
    const q=queue();
    if(q.length<4)break;
    // take fewest-played; shuffle ties a little so pairings vary
    const minP=q[3].played;
    const sure=q.filter(p=>p.played<minP);
    const tie=q.filter(p=>p.played===minP).sort(()=>Math.random()-.5);
    const four=[...sure,...tie].slice(0,4);
    const [a,b]=balance(four);
    S.active[c]={a,b};fresh.add(c);
  }
  save();render();
}
function finish(c){
  const m=S.active[c];

function nameOf(id){

function stats(){
  const m={},get=id=>m[id]||(m[id]={id,w:0,g:0,streak:0,sdone:false,partners:{},opps:{}});
  let n=0;
  for(const r of S.history){
    if(!r.ia||!r.ib)continue;n++;
    const aw=r.sa>r.sb;
    [[r.ia,r.ib,aw],[r.ib,r.ia,!aw]].forEach(([mine,theirs,won])=>mine.forEach(id=>{
      const s=get(id);s.g++;if(won)s.w++;
      if(!s.sdone){if(won)s.streak++;else s.sdone=true}
      mine.forEach(o=>{if(o!==id){const x=s.partners[o]||(s.partners[o]={g:0,w:0});x.g++;if(won)x.w++}});
      theirs.forEach(o=>{const x=s.opps[o]||(s.opps[o]={g:0,l:0});x.g++;if(!won)x.l++});
    }));
  }
  const list=Object.values(m).map(s=>{
    const pe=Object.entries(s.partners);
    const best=pe.filter(([,x])=>x.w>0).sort((a,b)=>b[1].w-a[1].w||b[1].w/b[1].g-a[1].w/a[1].g)[0];
    const often=pe.sort((a,b)=>b[1].g-a[1].g)[0];
    const tough=Object.entries(s.opps).filter(([,x])=>x.l>0).sort((a,b)=>b[1].l-a[1].l||b[1].l/b[1].g-a[1].l/a[1].g)[0];
    return {...s,rate:s.g?s.w/s.g:0,best,often,tough};
  }).sort((a,b)=>b.w-a.w||b.rate-a.rate||a.g-b.g);
  return {list,n};
}

    <div class="form-grid">
      <label for="s-date">Tanggal<input id="s-date" type="date" data-sched="date" value="${esc(s.date)}"></label>
      <label for="s-time">Jam<input id="s-time" type="time" data-sched="time" value="${esc(s.time)}"></label>
      <label for="s-place" class="full">Tempat<input id="s-place" data-sched="place" maxlength="40" placeholder="Nama GOR atau lapangan" value="${esc(s.place)}"></label>
    </div>
  </div>
  <div class="row between"><h2>Siapa ikut?</h2><span class="meta">Tap namamu sendiri</span></div>`;
  if(!S.players.length)h+=`<p class="note">Belum ada pemain. Tambahkan nama di tab Pemain dulu.</p>`;
  else h+=`<ul class="list card">${S.players.map(p=>{const v=rsvpOf(p.id);return `<li>
      <span class="grow"><span style="font-weight:600">${esc(p.name)}</span><div class="meta">${v==="yes"?"Ikut":v==="no"?"Tidak bisa":"Belum jawab"}</div></span>
      <span class="rsvp"><button data-rsvp="${p.id}" data-v="yes" aria-pressed="${v==="yes"}">Ikut</button><button data-rsvp="${p.id}" data-v="no" aria-pressed="${v==="no"}">Tidak</button></span></li>`}).join("")}</ul>`;
  if(yes.length)h+=`<button class="primary" id="applyRsvp">Jadikan ${yes.length} orang ini daftar hadir</button>
    <p class="note">Yang menjawab Ikut ditandai hadir di tab Pemain, sisanya tidak hadir. Ganti tanggal untuk membuka absen baru.</p>`;
  const txt=`🏸 Bultang Asik\n${schedText()}\n\nYang ikut (${yes.length}):\n${yes.map((p,i)=>`${i+1}. ${p.name}`).join("\n")||"-"}${no.length?`\n\nTidak bisa: ${no.map(p=>p.name).join(", ")}`:""}\n\nYang belum jawab, absen di link ya!`;
  h+=`<h2>Ajak grup</h2><textarea id="inviteText" readonly aria-label="Teks ajakan">${esc(txt)}</textarea>
    <div class="row"><button class="primary" data-copy="inviteText">Salin teks</button><span class="meta copymsg"></span></div>`;
  return h;
}
function kasSaldo(){return S.kas.entries.reduce((s,e)=>s+(e.type==="in"?e.amount:-e.amount),0)}
function debtOf(pid){return (S.kas.debts[pid]||[]).reduce((s,d)=>s+d.amt,0)}
function renderKas(){
  const K=S.kas,saldo=kasSaldo();
  let h=`<div class="row between" style="margin-top:10px"><h2>Kas grup</h2><span class="money ${saldo<0?"amt-out":""}">${rp(saldo)}</span></div>
  <form id="kasForm" class="card kas-form">
    <div class="seg" style="--n:2;--i:${kasType==="out"?1:0}"><span class="pill" aria-hidden="true"></span><button type="button" data-kastype="in" aria-pressed="${kasType==="in"}">Uang masuk</button><button type="button" data-kastype="out" aria-pressed="${kasType==="out"}">Uang keluar</button></div>
    <input id="kasAmt" type="number" inputmode="numeric" min="0" step="1000" placeholder="Nominal" aria-label="Nominal" required>
    <input id="kasNote" maxlength="40" placeholder="Catatan, mis. beli kok" aria-label="Catatan">
    <button class="primary" type="submit">Catat</button>
  </form>`;
  const debtors=Object.keys(K.debts).filter(id=>debtOf(id)>0);
  if(debtors.length){
    h+=`<div class="row between"><h2>Tunggakan</h2><span class="meta">${rp(debtors.reduce((s,id)=>s+debtOf(id),0))}</span></div>
    <ul class="list card">${debtors.map(id=>{const ds=K.debts[id];const nm=P(id)?.name||ds[0].name||"?";return `<li>
      <span class="grow"><span style="font-weight:600">${esc(nm)}</span><div class="meta">${ds.map(d=>dateLabel(d.date,{day:"numeric",month:"short"})).join(", ")}</div></span>
      <span class="money amt-out">${rp(debtOf(id))}</span><button class="ghost" data-paydebt="${id}">Lunas</button></li>`}).join("")}</ul>`;
  }
  h+=`<div class="row between"><h2>Catatan kas</h2><span class="meta">${K.entries.length} catatan</span></div>`;
  h+=K.entries.length?`<ul class="list card">${K.entries.slice(0,12).map(e=>`<li>
      <span class="grow"><span>${esc(e.note||(e.type==="in"?"Uang masuk":"Uang keluar"))}</span><div class="meta">${new Date(e.at).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}</div></span>
      <span class="money ${e.type==="in"?"amt-in":"amt-out"}">${e.type==="in"?"+":"−"}${rp(e.amount)}</span>
      <button class="ghost" data-delkas="${e.id}" aria-label="Hapus catatan">✕</button></li>`).join("")}</ul>`
    :`<p class="note">Belum ada catatan. Sisa pembulatan patungan otomatis masuk kas saat kamu memulai sesi baru.</p>`;
  return h;
}
function renderPatungan(){
  const B=S.bill;
  const num=(id,label,val,step)=>`<label for="${id}">${label}<input id="${id}" data-bill="${id.slice(2)}" type="number" inputmode="numeric" min="0" step="${step}" value="${val}"></label>`;
  let h=`<div class="row between"><h2>Patungan</h2><span class="meta">Biaya sesi hari ini</span></div>
  <div class="card"><div class="form-grid">
    ${num("b-courtPrice","Sewa lapangan / jam (Rp)",B.courtPrice,1000)}
    ${num("b-hours","Lama main (jam)",B.hours,0.5)}
    ${num("b-courtCount","Jumlah lapangan disewa",B.courtCount,1)}
    ${num("b-kokPrice","Harga kok / buah (Rp)",B.kokPrice,500)}
  </div>
  <div class="kokbar"><div><div style="font-weight:600">Kok terpakai</div><div class="meta">Tekan +1 tiap buka kok baru</div></div>
    <div class="stepper"><button data-kok="-1" aria-label="Kurangi kok">−</button><b data-kokcount>${B.kok}</b><button data-kok="1" aria-label="Tambah kok">+</button></div></div>
  </div>
  <div class="card" style="padding:12px;display:flex;flex-direction:column;gap:10px">
    <div><div class="meta" style="margin-bottom:4px">Cara bagi</div>
    <div class="seg" style="--n:2;--i:${B.mode==="main"?1:0}"><span class="pill" aria-hidden="true"></span><button data-mode="rata" aria-pressed="${B.mode==="rata"}">Rata semua</button><button data-mode="main" aria-pressed="${B.mode==="main"}">Kok sesuai jumlah main</button></div></div>
    <div><div class="meta" style="margin-bottom:4px">Pembulatan ke atas</div>
    <div class="seg" style="--n:4;--i:${Math.max(0,[1,500,1000,5000].indexOf(B.round))}"><span class="pill" aria-hidden="true"></span>${[[1,"Tanpa"],[500,"Rp500"],[1000,"Rp1.000"],[5000,"Rp5.000"]].map(([v,l])=>`<button data-round="${v}" aria-pressed="${B.round===v}">${l}</button>`).join("")}</div></div>
  </div>
  <div id="billOut"></div>${renderKas()}`;
  return h;
}
function renderBillOut(){
  const el=document.getElementById("billOut");if(!el)return;
  const B=S.bill,r=calcBill();
  const paidCount=r.rows.filter(x=>B.paid[x.p.id]).length;
  let h=`<div class="total"><div><span>Lapangan</span><strong>${rp(r.court)}</strong></div><div><span>Kok</span><strong>${rp(r.kok)}</strong></div><div><span>Total</span><strong>${rp(r.total)}</strong></div></div>`;
  h+=`<div class="row between" style="margin-top:14px"><h2>Per orang</h2><span class="meta">${paidCount}/${r.rows.length} lunas</span></div>`;
  if(!r.rows.length){h+=`<p class="note">Belum ada yang ikut. Tandai pemain hadir di tab Pemain.</p>`}
  else{
    h+=`<ul class="list card">${r.rows.map(({p,amt})=>`<li class="${B.paid[p.id]?"paid":""}">
      <input type="checkbox" class="check" id="paid-${p.id}" data-paid="${p.id}" ${B.paid[p.id]?"checked":""} aria-label="Lunas: ${esc(p.name)}">
      <label for="paid-${p.id}" class="grow"><div>${esc(p.name)}</div><div class="meta">${p.played}× main${B.paid[p.id]?" · lunas":""}${debtOf(p.id)?` · <span class="amt-out">tunggakan ${rp(debtOf(p.id))}</span>`:""}</div></label>
      <span class="money">${rp(amt)}</span>
      <button class="ghost" data-out="${p.id}" aria-label="Keluarkan ${esc(p.name)} dari patungan">✕</button></li>`).join("")}</ul>`;
    const extra=r.collected-r.total;
    h+=`<p class="note">${B.mode==="main"&&r.games===0?"Belum ada pertandingan selesai, jadi semua dibagi rata dulu. ":""}${extra>0?`Pembulatan menyisakan ${rp(extra)} untuk kas.`:""}</p>`;
  }
  const outs=S.players.filter(p=>B.out[p.id]);
  if(outs.length)h+=`<p class="note">Tidak ikut patungan: ${outs.map(p=>`<button class="ghost" data-in="${p.id}" style="padding:2px 8px;font-size:12px">${esc(p.name)} ↺</button>`).join(" ")}</p>`;
  if(r.rows.length){
    const d=new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long"});
    const txt=`🏸 Patungan Bultang Asik, ${d}\nLapangan: ${B.courtCount} lap × ${B.hours} jam × ${rp(B.courtPrice)} = ${rp(r.court)}\nKok: ${B.kok} × ${rp(B.kokPrice)} = ${rp(r.kok)}\nTotal: ${rp(r.total)}\n\n${r.rows.map(({p,amt},i)=>`${i+1}. ${p.name}: ${rp(amt)}${B.paid[p.id]?" ✅":""}${debtOf(p.id)?` (+ tunggakan ${rp(debtOf(p.id))})`:""}`).join("\n")}`;
    h+=`<h2 style="margin-top:6px">Kirim ke grup</h2><textarea id="billText" readonly aria-label="Ringkasan patungan">${esc(txt)}</textarea>
    <div class="row"><button class="primary" data-copy="billText">Salin teks</button><span class="meta copymsg"></span></div>`;
  }
  el.style.display="flex";el.style.flexDirection="column";el.style.gap="10px";
  el.innerHTML=h;
}
function render(){
  // keep what someone is typing when a live update from the group arrives
  const keep={};document.querySelectorAll(".wrap input[id]").forEach(i=>{if(/^(sa|sb)\d+$|^newName$|^kasAmt$|^kasNote$/.test(i.id)&&i.value)keep[i.id]=i.value});
  const ae=document.activeElement,aid=ae&&ae.id&&ae.matches("input,select")?ae.id:null;
  const aval=aid?ae.value:null;let selS=null,selE=null;try{if(aid){selS=ae.selectionStart;selE=ae.selectionEnd}}catch(e){}
  renderInner();
  Object.entries(keep).forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.value=v});
  if(aid){const el=document.getElementById(aid);if(el){el.value=aval;el.focus({preventScroll:true});try{if(selS!=null)el.setSelectionRange(selS,selE)}catch(e){}}}
}
function renderInner(){
  document.getElementById("exampleBanner").hidden=!S.example;
  document.getElementById("tab-jadwal").innerHTML=renderJadwal();
  document.getElementById("tab-lapangan").innerHTML=renderLapangan();
  document.getElementById("tab-pemain").innerHTML=renderPemain();
  document.getElementById("tab-riwayat").innerHTML=renderRiwayat();
  document.getElementById("tab-patungan").innerHTML=renderPatungan();
  renderBillOut();
  fresh.clear();
  if(bumpKok){bumpKok=false;document.querySelectorAll("[data-kokcount]").forEach(el=>el.classList.add("bump"))}
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(!canWrite&&!t.dataset.tab&&!t.dataset.copy&&t.id!=="toggleAll")return;
  if(t.dataset.tab){
    const tabs=["jadwal","lapangan","pemain","riwayat","patungan"];
    if(t.getAttribute("aria-selected")==="true")return;
    document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b===t));
    document.querySelector(".ind").style.setProperty("--i",tabs.indexOf(t.dataset.tab));
    tabs.forEach(n=>document.getElementById("tab-"+n).hidden=n!==t.dataset.tab);
    animateIn(document.getElementById("tab-"+t.dataset.tab));
    try{window.scrollTo({top:0,behavior:"smooth"})}catch(err){window.scrollTo(0,0)}
    return;
  }
  if(t.id==="cPlus"&&S.courts<8){S.courts++;}
  else if(t.id==="cMinus"&&S.courts>1){if(!S.active[S.courts-1]){S.courts--;S.active.length=Math.min(S.active.length,S.courts)}}
  else if(t.id==="fill"){fillCourts();return}
  else if(t.dataset.finish){finish(+t.dataset.finish);return}
  else if(t.dataset.cancel){cancel(+t.dataset.cancel);return}
  else if(t.dataset.present){const p=P(t.dataset.present);if(onCourt().has(p.id))return;p.present=!p.present}
  else if(t.dataset.del){if(onCourt().has(t.dataset.del))return;S.players=S.players.filter(p=>p.id!==t.dataset.del)}
  else if(t.dataset.kok){S.bill.kok=Math.max(0,S.bill.kok+ +t.dataset.kok);bumpKok=true}
  else if(t.dataset.mode||t.dataset.round){
    // slide the pill in place instead of re-rendering, so the movement is visible
    if(t.getAttribute("aria-pressed")==="true")return;
    if(t.dataset.mode)S.bill.mode=t.dataset.mode;else S.bill.round=+t.dataset.round;
    const seg=t.closest(".seg"),btns=[...seg.querySelectorAll("button")];
    btns.forEach(b=>b.setAttribute("aria-pressed",b===t));
    seg.style.setProperty("--i",btns.indexOf(t));
    save();renderBillOut();return;
  }
  else if(t.dataset.out){S.bill.out[t.dataset.out]=true}
  else if(t.dataset.in){delete S.bill.out[t.dataset.in]}
  else if(t.dataset.rsvp){setRsvp(t.dataset.rsvp,t.dataset.v);return}
  else if(t.id==="applyRsvp"){S.players.forEach(p=>{p.present=rsvpOf(p.id)==="yes"||onCourt().has(p.id)});showToast("Daftar hadir diperbarui")}
  else if(t.id==="autoLevel"){S.autoLevel=!S.autoLevel;S.players.forEach(p=>{p.lg=0;p.lw=0})}
  else if(t.dataset.kastype){
    if(t.getAttribute("aria-pressed")==="true")return;
    kasType=t.dataset.kastype;const seg=t.closest(".seg"),btns=[...seg.querySelectorAll("button")];
    btns.forEach(b=>b.setAttribute("aria-pressed",b===t));seg.style.setProperty("--i",btns.indexOf(t));return;
  }
  else if(t.dataset.paydebt){const nm=P(t.dataset.paydebt)?.name;delete S.kas.debts[t.dataset.paydebt];showToast(`Tunggakan ${nm||""} lunas`)}
  else if(t.dataset.delkas){S.kas.entries=S.kas.entries.filter(e=>e.id!==t.dataset.delkas)}
  else if(t.dataset.copy){
    const ta=document.getElementById(t.dataset.copy),msg=t.parentElement.querySelector(".copymsg");
    const fallback=()=>{ta.focus();ta.select();msg.textContent="Teks sudah dipilih, salin manual."};
    try{navigator.clipboard.writeText(ta.value).then(()=>{msg.textContent="Tersalin. Tempel di grup WhatsApp."},fallback)}catch(err){fallback()}
    return;
  }
  else if(t.id==="clearExample"){S=normalize({example:false,courts:S.courts,players:[],active:[],history:[],bill:Object.assign({},BILL0,{paid:{},out:{}})})}
  else if(t.id==="askReset"){pendingConfirm="reset"}
  else if(t.id==="noReset"){pendingConfirm=null}
  else if(t.id==="doReset"){pendingConfirm=null;closeSession();S.active=[];S.bill.kok=0;S.bill.paid={};S.bill.out={};S.players.forEach(p=>{p.played=0;p.wins=0;p.lastAt=0})}
  else if(t.id==="askWipe"){pendingConfirm="wipe"}
  else if(t.id==="doWipe"){pendingConfirm=null;S.history=[];openStats.clear()}
  else if(t.id==="toggleAll"){showAll=!showAll;render();return}
  else return;
  save();render();
});
document.addEventListener("toggle",e=>{
  const d=e.target;if(!d.dataset||!d.dataset.stat)return;
  if(d.open)openStats.add(d.dataset.stat);else openStats.delete(d.dataset.stat);
},true);
document.addEventListener("change",e=>{
  if(!canWrite)return;
  const s=e.target;if(s.dataset.level){P(s.dataset.level).level=+s.value;save();render()}
  if(s.dataset.paid){if(s.checked)S.bill.paid[s.dataset.paid]=true;else delete S.bill.paid[s.dataset.paid];save();renderBillOut()}
});
document.addEventListener("input",e=>{
  const s=e.target;
  if(s.dataset.sched&&canWrite){S.schedule[s.dataset.sched]=s.value;save();const el=document.getElementById("schedSum");if(el)el.textContent=schedText()||"Atur tanggal main";return}
  if(!s.dataset.bill||!canWrite)return;
  const v=parseFloat(s.value);S.bill[s.dataset.bill]=isNaN(v)||v<0?0:v;save();renderBillOut();
});
document.addEventListener("submit",e=>{
  e.preventDefault();if(!canWrite)return;
  if(e.target.id==="kasForm"){
    const a=document.getElementById("kasAmt"),n=document.getElementById("kasNote");
    const amount=Math.round(parseFloat(a.value));if(!(amount>0))return;
    S.kas.entries.unshift({id:uid(),at:Date.now(),type:kasType,amount,note:n.value.trim()});
    if(S.kas.entries.length>KAS_MAX)S.kas.entries.length=KAS_MAX;
    a.value="";n.value="";save();render();showToast(kasType==="in"?`+${rp(amount)} masuk kas`:`−${rp(amount)} keluar dari kas`);return;
  }
  const inp=document.getElementById("newName");
  const n=inp.value.trim();if(!n)return;
  S.example=false;
  S.players.push({id:uid(),name:n,level:+document.getElementById("newLevel").value,present:true,played:0,wins:0});
  inp.value="";
  save();render();document.getElementById("newName").focus();
});
render();
animateIn(document.getElementById("tab-lapangan"));
startSync();
</script>
</body>
</html>
