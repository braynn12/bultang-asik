<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bultang Asik">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<title>Bultang Asik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one column. Top: who plays and how long. Middle: the generated game table as a stack of match cards. Second tab: the bill. */
:root{
  /* Design system "Court Night": navy + oranye energik + hijau untuk status selesai/lunas.
     Font: Barlow Condensed (judul, angka) + Barlow (teks). */
  --bg:#0F172A; --surface:#192134; --surface2:#1F2A40; --fg:#F8FAFC; --muted:#94A3B8; --line:#2A3448;
  --court:#F97316; --court-ink:#0F172A;
  --accent:#F97316; --accent-edge:#EA580C; --accent-ink:#0F172A;
  --pink:#F97316; --ok:#22C55E; --ok-ink:#0F172A; --danger:#EF4444;
  --soft-blue:#1C2740; --soft-pink:#2B1A22; --soft-mint:#13291F; --soft-sun:#2A1E14;
  --display:"Barlow Condensed","Barlow",system-ui,sans-serif;
  --body:"Barlow",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);
  --tap:44px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#FFF7ED; --surface:#FFFFFF; --surface2:#FFF1E2; --fg:#0F172A; --muted:#475569; --line:#F3DFC8;
  --court:#C2410C; --court-ink:#FFFFFF;
  --accent:#F97316; --accent-edge:#EA580C; --accent-ink:#0F172A;
  --pink:#C2410C; --ok:#15803D; --ok-ink:#FFFFFF; --danger:#DC2626;
  --soft-blue:#EEF2F8; --soft-pink:#FDECEC; --soft-mint:#E8F6EC; --soft-sun:#FFEDD5; color-scheme:light}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;transition:background-color .35s var(--ease),color .35s var(--ease)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px calc(108px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.ic{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(36px,10vw,46px);line-height:1;margin:0;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1 span{color:var(--pink)}
h1 .shuttle{width:.8em;height:.8em;color:var(--accent);stroke-width:2.2;animation:shuttle 2.6s ease-in-out infinite;transform-origin:50% 80%}
@keyframes shuttle{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-6px) rotate(10deg)}}
.sub{color:var(--muted);font-size:14px;font-weight:600;margin:6px 0 8px}
h2{font-family:var(--display);font-weight:700;font-size:26px;margin:0;text-transform:uppercase;letter-spacing:.5px}
.hdr-right{display:flex;gap:6px;align-items:center;flex:none;padding-top:4px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted);border:2px solid var(--line);border-radius:99px;padding:3px 10px;white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.live{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.sync.live::before{background:var(--ok);animation:pulse 2.2s ease-in-out infinite}
.sync.err{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.sync.err::before{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.meta{color:var(--muted);font-size:13px;font-weight:600}
.note{color:var(--muted);font-size:13px;margin:0}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;min-height:var(--tap);display:inline-flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent;transition:background-color .2s var(--ease),border-color .2s var(--ease),transform .12s var(--ease),box-shadow .2s var(--ease),opacity .2s}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--court) 45%,transparent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 28%,transparent)}
.primary:active:not(:disabled){transform:scale(.97);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 25%,transparent)}
.primary:disabled{box-shadow:none}
.icon{width:var(--tap);height:var(--tap);padding:0;border-radius:50%;font-size:18px}
input{font:inherit;font-weight:600;color:var(--fg);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:9px 12px;min-height:var(--tap);min-width:0;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus{outline:none;border-color:var(--court);box-shadow:0 0 0 4px color-mix(in srgb,var(--court) 18%,transparent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:14px;display:flex;flex-direction:column;gap:12px}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-title b{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.3px;text-transform:uppercase;display:inline-flex;align-items:center;gap:8px}
.card-title b .ic{color:var(--court)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.full{grid-column:1/-1}

/* navigasi bawah */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs{display:flex;max-width:520px;margin:0 auto;position:relative;isolation:isolate}
.tabs .pill{position:absolute;top:0;bottom:0;left:0;width:calc(100% / 3);border-radius:16px;background:color-mix(in srgb,var(--accent) 16%,transparent);transform:translateX(calc(var(--i,0) * 100%));transition:transform .38s var(--ease);z-index:-1}
.tabs button{flex:1;min-width:0;min-height:56px;border:0;background:transparent;flex-direction:column;gap:2px;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.3px;line-height:1.1;padding:6px 4px;color:var(--muted)}
.tabs button .ic{width:24px;height:24px}
.tabs button[aria-selected="true"]{color:var(--court)}
.tabs button:active{transform:none}

/* pemain */
.players{display:flex;flex-wrap:wrap;gap:8px}
.pchip{display:inline-flex;align-items:center;gap:4px;padding:3px 3px 3px 14px;min-height:var(--tap);border-radius:99px;font-weight:700;font-size:16px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);border:2px solid color-mix(in srgb,var(--c) 30%,transparent)}
.pchip button{width:36px;height:36px;min-height:36px;padding:0;border:0;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,transparent);color:inherit;font-size:15px;position:relative}
.pchip button::after{content:"";position:absolute;inset:-4px}
.add{display:grid;grid-template-columns:1fr auto;gap:8px}
.seg{display:flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;position:relative;isolation:isolate;background:var(--surface)}
.seg .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n,2));border-radius:10px;background:var(--court);transform:translateX(calc(var(--i,0) * 100%));transition:transform .38s var(--ease);z-index:-1}
.seg button{flex:1;border:0;border-radius:0;background:transparent;padding:8px 6px;font-size:14px;min-height:var(--tap)}
.seg button[aria-pressed="true"]{color:var(--court-ink)}
.seg button:active{transform:none}
.summary{background:var(--soft-blue);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px}
.summary b{font-family:var(--display);font-weight:600;font-size:16px}
.warn{background:var(--soft-pink);color:var(--danger);border-radius:14px;padding:10px 12px;font-weight:700;font-size:13px}
.banner{background:var(--soft-sun);border:2px dashed var(--accent);border-radius:18px;padding:10px 12px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* tabel game */
.games{display:flex;flex-direction:column;gap:10px}
.game{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 12px;transition:opacity .3s var(--ease),background-color .3s var(--ease),border-color .3s var(--ease)}
.game.now{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.game.done{opacity:.55}
.game.done .match{text-decoration:line-through;text-decoration-thickness:2px}
.gnum{display:flex;flex-direction:column;align-items:center;min-width:46px}
.gnum b{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;color:var(--court)}
.gnum small{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.gbody{min-width:0;display:flex;flex-direction:column;gap:5px}
.match{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.team{display:inline-flex;gap:4px;flex-wrap:wrap}
.n{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:700;font-size:15px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c)}
.vs{font-family:var(--display);font-weight:600;font-size:14px;color:var(--muted);text-transform:uppercase}
.lap{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.rest{font-size:14px;color:var(--muted);font-weight:500}
.tick{width:var(--tap);height:var(--tap);padding:0;border-radius:50%;font-size:20px;border:2px solid var(--line);background:var(--surface);color:var(--line)}
.tick .ic{stroke-width:3}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--ok-ink)}
.nowtag{font-size:11px;font-weight:800;color:var(--court-ink);background:var(--court);border-radius:99px;padding:1px 7px;margin-top:3px}
.tally{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tally div{border-radius:14px;padding:8px 10px;background:color-mix(in srgb,var(--c) 12%,var(--surface));min-width:0}
.tally b{display:block;color:var(--c);font-weight:800;overflow-wrap:anywhere}
.tally small{color:var(--muted);font-weight:700;font-size:12px}
textarea{font:inherit;font-size:13px;width:100%;min-height:150px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:10px}
details.txt summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:700}

/* gambar */
.imgprev{width:100%;border-radius:14px;border:2px solid var(--line);display:block}
.btnlink{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:700;color:var(--fg);border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 14px}
.btnlink.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 28%,transparent)}
/* matriks setim */
.mx-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mx{border-collapse:separate;border-spacing:3px;font-size:13px;margin:0 auto}
.mx th{font-weight:800;color:var(--c,var(--muted));padding:2px 4px;white-space:nowrap;font-size:12px}
.mx thead th{writing-mode:horizontal-tb}
.mx tbody th{text-align:right}
.mx td{width:34px;height:30px;text-align:center;border-radius:8px;font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
.mx td.self{color:var(--muted)}
.mx td.v0{background:var(--soft-pink);color:var(--danger)}
.mx td.v1{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.mx td.v2{background:color-mix(in srgb,var(--ok) 26%,var(--surface));color:var(--ok)}
.mx td.v3{background:color-mix(in srgb,var(--ok) 40%,var(--surface));color:var(--fg)}
/* patungan */
.kok{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft-mint);border-radius:14px;padding:10px 12px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:var(--tap);height:var(--tap);padding:0;font-size:20px}
.stepper b{font-family:var(--display);font-weight:700;font-size:34px;min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
.total{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.total div{border-radius:14px;padding:8px 10px;min-width:0}
.total div:nth-child(1){background:var(--soft-blue)}
.total div:nth-child(2){background:var(--soft-mint)}
.total div:nth-child(3){background:var(--soft-sun)}
.total span{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.total strong{font-family:var(--display);font-weight:700;font-size:clamp(17px,5vw,24px);font-variant-numeric:tabular-nums;white-space:nowrap}
.people{list-style:none;margin:0;padding:0}
.people li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:2px solid var(--line)}
.people li:first-child{border-top:0}
.people .money{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap}
.people li.paid .who{text-decoration:line-through;opacity:.6}
.check{width:24px;height:24px;accent-color:var(--ok);flex:none}
/* patungan khusus */
.sp li{flex-direction:column;align-items:stretch;gap:8px}
.sp .top{display:flex;align-items:center;gap:10px}
.sp .times{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;padding-left:32px}
.sp .times input{padding:7px 10px}
.sp .times button{padding:7px 10px;font-size:12px}
.sp li.part .times input{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.tagp{font-size:11px;font-weight:800;color:var(--accent-ink);background:var(--accent);border-radius:99px;padding:1px 8px;white-space:nowrap}
.brk{font-size:12px;color:var(--muted);font-weight:600;padding-left:32px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:700;z-index:6;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.show{animation:toastIn .35s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.enter>*{animation:rise .4s var(--ease) both}
.games.enter .gwrap{animation:rise .4s var(--ease) both}
/* geser kartu game */
.gwrap{position:relative;border-radius:18px}
.wrap{overflow-x:clip}
.game{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.gswipe{position:absolute;inset:0;border-radius:18px;background:var(--soft-mint);color:var(--ok);display:flex;align-items:center;gap:8px;padding-left:20px;font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.3px;opacity:0;transition:opacity .2s var(--ease),background-color .2s var(--ease),color .2s var(--ease)}
.gswipe .ic{width:22px;height:22px;stroke-width:3}
.gwrap.swiping .gswipe{opacity:1}
.gwrap.armed .gswipe{background:var(--ok);color:var(--ok-ink)}
.game{transition:opacity .3s var(--ease),background-color .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease)}
/* iOS */
.ios .check[switch]{width:auto;height:auto;accent-color:var(--ok)}
.standalone body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#0F172A;z-index:20}
.ios-tip{border-style:solid;border-color:color-mix(in srgb,var(--accent) 50%,var(--line));flex-wrap:nowrap}
.ios-tip img{border-radius:10px;flex:none}
.ios-tip .ic{color:var(--court)}
html{-webkit-text-size-adjust:100%}
/* Android: impor WhatsApp, layar menyala */
.imp{border:2px solid color-mix(in srgb,var(--ok) 55%,var(--line))}
.imp .card-title b .ic{color:var(--ok)}
.wake{justify-content:flex-start;font-size:14px;font-weight:600;color:var(--muted);border-style:dashed;text-align:left}
.wake[aria-pressed="true"]{color:var(--court);border-style:solid;border-color:color-mix(in srgb,var(--court) 45%,var(--line));background:color-mix(in srgb,var(--court) 8%,var(--surface))}
@media (max-width:420px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3 .last{grid-column:1/-1}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-shuttle" viewBox="0 0 24 24"><path d="M5 3h14l-4.5 11h-5z"/><path d="M10 3l1 11M14 3l-1 11"/><circle cx="12" cy="18" r="3.5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></symbol>
  <symbol id="i-timer" viewBox="0 0 24 24"><path d="M10 2h4M12 14l3-3"/><circle cx="12" cy="14" r="8"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3"/></symbol>
  <symbol id="i-court" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="5" rx="2"/><path d="M12 5v14M2 12h20"/></symbol>

/* ---------- waktu ---------- */
const toMin=t=>{const [h,m]=String(t||"0:0").split(":").map(Number);return (h||0)*60+(m||0)};
const fmt=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+"."+String(m%60).padStart(2,"0")};
function totalMin(s){let d=toMin(s.end)-toMin(s.start);if(d<=0)d+=1440;return d}
function nGames(s){return Math.max(0,Math.floor(totalMin(s)/Math.max(5,s.minutes)))}

/* ---------- pembuat tabel yang adil ----------
   Tiap game diisi pemain dengan jumlah main paling sedikit; kalau sama, yang paling lama
   istirahat didahulukan. Ratusan susunan dicoba, lalu dipilih yang pasangannya paling
   bervariasi dan paling jarang ada orang istirahat dua game berturut-turut. */
const pk=(a,b)=>a<b?a+"|"+b:b+"|"+a;
function splits(f){return [[[f[0],f[1]],[f[2],f[3]]],[[f[0],f[2]],[f[1],f[3]]],[[f[0],f[3]],[f[1],f[2]]]]}
function combos(arr,k){const out=[];(function go(i,cur){if(cur.length===k){out.push(cur.slice());return}for(let j=i;j<arr.length;j++){cur.push(arr[j]);go(j+1,cur);cur.pop()}})(0,[]);return out}
function buildSchedule(ids,courts,count,prior){
  // 1) yang paling sedikit main wajib masuk; 2) pasangan yang belum pernah setim diutamakan;
  // 3) hindari istirahat dua game beruntun; 4) lawan juga diusahakan berganti.
  // Ratusan tabel dicoba, dipilih yang paling cepat membuat semua orang pernah setim.
  const slots=courts*4;if(ids.length<slots||count<=0)return [];
  const tries=courts===2?60:300;
  const allPairs=[];for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)allPairs.push(pk(ids[i],ids[j]));
  let best=null,bestScore=Infinity;
  for(let t=0;t<tries;t++){
    const cnt={},sit={},pc={},oc={};let lastQ=[],score=0;
    const play=g=>{
      const on=new Set();
      g.forEach(({a,b})=>{[...a,...b].forEach(i=>on.add(i));pc[pk(a[0],a[1])]=(pc[pk(a[0],a[1])]||0)+1;pc[pk(b[0],b[1])]=(pc[pk(b[0],b[1])]||0)+1;a.forEach(x=>b.forEach(y=>{oc[pk(x,y)]=(oc[pk(x,y)]||0)+1}))});
      Object.keys(cnt).forEach(i=>{if(on.has(i)){cnt[i]++;sit[i]=0}else sit[i]++});
      return g.map(c=>[...c.a,...c.b].sort().join());
    };
    const seen=new Set();prior.forEach(g=>g.courts.forEach(c=>[...c.a,...c.b].forEach(i=>seen.add(i))));
    seen.forEach(i=>{cnt[i]=0;sit[i]=0});
    prior.forEach(g=>{lastQ=play(g.courts)});
    const present=ids.filter(i=>seen.has(i));
    const base=present.length?Math.min(...present.map(i=>cnt[i])):0;
    ids.forEach(i=>{if(!seen.has(i)){cnt[i]=base;sit[i]=1}});
    Object.keys(cnt).forEach(i=>{if(!ids.includes(i))delete cnt[i]});
    const restW=ids.length===8&&courts===1?4:10;
    const pairCost=(x,y)=>{const n=pc[pk(x,y)]||0;return n*n*8};
    const games=[];
    for(let g=0;g<count;g++){
      const ord=ids.slice().sort(()=>Math.random()-.5).sort((x,y)=>cnt[x]-cnt[y]);
      const thr=cnt[ord[slots-1]];
      const forced=ord.filter(i=>cnt[i]<thr),pool=ord.filter(i=>cnt[i]===thr);
      const picks=combos(pool,slots-forced.length).map(c=>forced.concat(c));
      let bestG=null,bc=Infinity;
      picks.forEach(sel=>{
        let base=0;ids.forEach(i=>{if(!sel.includes(i)&&sit[i]>=1)base+=restW*sit[i]});
        const groups=courts===1?[[sel]]:combos(sel.slice(1),3).map(c=>{const g1=[sel[0],...c];return [g1,sel.filter(i=>!g1.includes(i))]});
        groups.forEach(gr=>{
          const opts=gr.map(q=>splits(q));
          const pick=gr.length===1?opts[0].map(o=>[o]):opts[0].flatMap(o1=>opts[1].map(o2=>[o1,o2]));
          pick.forEach(p=>{
            let c=base;
            p.forEach(([a,b])=>{c+=pairCost(a[0],a[1])+pairCost(b[0],b[1]);a.forEach(x=>b.forEach(y=>{c+=oc[pk(x,y)]||0}))});
            p.forEach(([a,b])=>{if(lastQ.includes([...a,...b].sort().join()))c+=6});
            c+=Math.random()*0.5;
            if(c<bc){bc=c;bestG=p}
          });
        });
      });
      const gm=bestG.map(([a,b])=>({a,b}));
      score+=bc;lastQ=play(gm);
      score+=allPairs.filter(k=>!pc[k]).length*1.5; // makin cepat semua pernah setim, makin baik
      games.push({courts:gm});
    }
    const v=ids.map(i=>cnt[i]);score+=Math.max(0,Math.max(...v)-Math.min(...v)-1)*1000;
    if(score<bestScore){bestScore=score;best=games}
  }
  return best;
}
function makeGames(s,keep){
  const ids=s.players.map(p=>p.id);
  const rest=buildSchedule(ids,s.courts,Math.max(0,nGames(s)-keep.length),keep);
  return keep.concat(rest.map(g=>({courts:g.courts,done:false,rest:ids.filter(i=>!g.courts.some(c=>[...c.a,...c.b].includes(i)))})));
}

/* ---------- sync grup (Firebase) ---------- */
let docRef=null,lastSent=null,writeTimer=null,writing=false;
function setSync(kind,text){const el=document.getElementById("sync");el.className="sync"+(kind==="live"?" live":kind==="err"?" err":"");el.textContent=text||({live:"Live bareng grup",local:"Hanya di HP ini"}[kind]||"")}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(docRef&&!S.example){clearTimeout(writeTimer);writeTimer=setTimeout(push,400)}
}
async function push(){
  if(writing){writeTimer=setTimeout(push,300);return}
  writeTimer=null;const json=JSON.stringify(S);if(json===lastSent)return;
  writing=true;const prev=lastSent;lastSent=json;
  try{await docRef.set({json,updatedAt:Date.now()});setSync("live")}
  catch(e){lastSent=prev;setSync("err",e&&e.code==="permission-denied"?"Akses database ditolak":"Gagal sinkron")}
  finally{writing=false}
}
function startSync(){
  if(!window.firebase||typeof FIREBASE_CONFIG==="undefined"||!FIREBASE_CONFIG.projectId||FIREBASE_CONFIG.projectId.startsWith("ISI_")){setSync("local");afterFirstSync();return}
  try{firebase.initializeApp(FIREBASE_CONFIG);docRef=firebase.firestore().collection("bultang").doc("v2")}catch(e){setSync("err","Config Firebase salah");afterFirstSync();return}
  docRef.onSnapshot(snap=>{
    if(snap.exists){
      const d=snap.data();
      if(d&&typeof d.json==="string"&&d.json!==lastSent&&!writeTimer&&!writing){
        try{const next=JSON.parse(d.json);if(next&&Array.isArray(next.players)){lastSent=d.json;S=normalize(next);try{localStorage.setItem(KEY,d.json)}catch(e){}render()}}catch(e){}
      }
    }else if(!S.example)save();
    setSync("live");afterFirstSync();
  },err=>{docRef=null;setSync("err",err&&err.code==="permission-denied"?"Akses database ditolak":"Sinkron terputus");afterFirstSync()});
}
/* aksi yang mengubah data (pintasan "Tambah kok") ditunda sampai data grup terbaru masuk,
   supaya tidak tertimpa snapshot Firebase atau malah menimpa data orang lain */

function afterFirstSync(){

/* ---------- pemain dari kontak & WhatsApp (Android) ---------- */
function addPlayers(names){
  let added=0,skipped=0;
  names.forEach(raw=>{
    const v=String(raw).trim().slice(0,16);if(!v)return;
    if(S.players.length>=8||S.players.some(p=>p.name.toLowerCase()===v.toLowerCase())){skipped++;return}
    const used=new Set(S.players.map(p=>p.c));let c=0;while(used.has(c)&&c<8)c++;
    const p={id:uid(),name:v,c};S.players.push(p);S.names[p.id]=v;added++;
  });
  if(added){touch();regenerate();save()}
  return {added,skipped};
}
// nama depan saja, kecuali ada dua orang dengan nama depan sama
function shortNames(list){
  const first=list.map(n=>n.trim().split(/\s+/)[0]);
  return list.map((n,i)=>first.filter(f=>f.toLowerCase()===first[i].toLowerCase()).length>1?n.trim():first[i]);
}
// baca daftar nama dari pesan WhatsApp: "1. Andi", "- Budi", "• Citra", atau "Andi, Budi, Citra"
function parseNames(text){
  text=String(text||"").replace(/\p{Extended_Pictographic}|️|‍/gu,"");
  let lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length===1&&/[,;]/.test(lines[0]))lines=lines[0].split(/[,;]/).map(s=>s.trim()).filter(Boolean);
  const bullet=/^(\d+\s*[.)\-:]|[-•*·–])\s*/;
  const listed=lines.filter(l=>bullet.test(l));
  const src=listed.length>=2?listed.map(l=>l.replace(bullet,"")):lines;
  const out=[];
  src.forEach(l=>{
    const n=l.replace(/@/g,"").replace(/\(.*?\)|\[.*?\]/g,"").replace(/[*_~]/g,"").replace(/\s+/g," ").trim();
    if(!n||n.length>24||n.split(" ").length>3||/^https?:/i.test(n))return;
    if(!out.some(o=>o.toLowerCase()===n.toLowerCase()))out.push(n.slice(0,16));
  });
  return out.slice(0,8);
}
let pendingImport=null;
function renderImport(){

}

/* ---------- layar tetap menyala ---------- */
let wakeOn=true,wakeSentinel=null;
try{wakeOn=localStorage.getItem(WAKE_KEY)!=="0"}catch(e){}
// dipanggil tiap render; permintaan dijalankan berurutan supaya tidak dobel
let wakeBusy=false,wakeAgain=false;
async function syncWake(){
  if(!CAN_WAKE)return;
  if(wakeBusy){wakeAgain=true;return}
  wakeBusy=true;
  try{
    do{
      wakeAgain=false;
      const want=wakeOn&&tab==="jadwal"&&document.visibilityState==="visible"&&S.games.length>0;
      if(want&&!wakeSentinel){
        const s=await navigator.wakeLock.request("screen");wakeSentinel=s;
        s.addEventListener("release",()=>{if(wakeSentinel===s)wakeSentinel=null});
      }else if(!want&&wakeSentinel){const s=wakeSentinel;wakeSentinel=null;await s.release()}
    }while(wakeAgain);
  }catch(e){wakeSentinel=null}
  finally{wakeBusy=false}
}
document.addEventListener("visibilitychange",syncWake);

/* ---------- tampilan ---------- */
let tab="jadwal",enterGames=false,toastT=null;
const TABS=["jadwal","patungan","khusus"];
const nm=id=>S.names[id]||"?";
const colorOf=id=>{const p=S.players.find(x=>x.id===id);return COLORS[(p?p.c:Object.keys(S.names).indexOf(id))%COLORS.length]};
const chip=id=>`<span class="n" style="--c:${colorOf(id)}">${esc(nm(id))}</span>`;
function showToast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;el.classList.remove("show");void el.offsetWidth;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}
function tallies(){
  const m={};S.players.forEach(p=>m[p.id]={main:0,rehat:0});
  S.games.forEach(g=>{const on=new Set(g.courts.flatMap(c=>[...c.a,...c.b]));Object.keys(m).forEach(i=>{if(on.has(i))m[i].main++;else m[i].rehat++});on.forEach(i=>{if(!m[i])m[i]={main:1,rehat:0,gone:true}})});
  return m;
}
function gameTime(i){const st=toMin(S.start)+i*S.minutes;return fmt(st)}
function renderMatrix(){
  const ps=S.players;if(ps.length<4||!S.games.length)return "";
  const pc={};S.games.forEach(g=>g.courts.forEach(c=>[c.a,c.b].forEach(([x,y])=>{const k=pk(x,y);pc[k]=(pc[k]||0)+1})));
  const miss=[];ps.forEach((a,i)=>ps.slice(i+1).forEach(b=>{if(!pc[pk(a.id,b.id)])miss.push(a.name+" & "+b.name)}));
  // nomor game ketika semua pasangan sudah lengkap
  let full=null;{const seen=new Set();const need=ps.length*(ps.length-1)/2;const ids=new Set(ps.map(p=>p.id));
    S.games.some((g,i)=>{g.courts.forEach(c=>[c.a,c.b].forEach(([x,y])=>{if(ids.has(x)&&ids.has(y))seen.add(pk(x,y))}));if(seen.size>=need){full=i+1;return true}})}

  return `<div class="card"><div class="card-title"><b>${ic("grid")}Sudah setim berapa kali</b></div>

      :`<div class="summary">${ic("check-circle")} Semua orang pernah setim dengan semua orang${full?`, lengkap di game ke-${full}`:""}.</div>`}
    <div class="mx-wrap"><table class="mx"><thead><tr><th></th>${ps.map(p=>`<th style="--c:${COLORS[p.c%COLORS.length]}">${short(p.name)}</th>`).join("")}</tr></thead>

    <p class="note">Angka = berapa kali dua orang itu satu tim di tabel ini.</p></div>`;
}

function billCalc(){
  const B=S.bill,hours=B.hours!=null?B.hours:totalMin(S)/60;
  const court=B.courtPrice*hours*S.courts,kok=B.kokPrice*B.kok,total=court+kok;
  const t=tallies(),ids=Object.keys(t);
  const games=ids.reduce((a,i)=>a+t[i].main,0);
  const rows=ids.map(i=>{
    let raw=B.mode==="main"&&games?court/ids.length+kok*t[i].main/games:(ids.length?total/ids.length:0);
    return {id:i,main:t[i].main,amt:B.round>1?Math.ceil(raw/B.round)*B.round:Math.round(raw)};
  });
  return {hours,court,kok,total,rows,collected:rows.reduce((a,r)=>a+r.amt,0)};
}

/* ---------- patungan khusus ----------
   Waktu sewa dipotong-potong di setiap jam datang/pulang. Biaya lapangan tiap potongan
   dibagi ke orang yang sedang ada di lapangan saat itu. Kok tetap dibagi rata. */
const hm=m=>{m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
function billKhusus(){
  const B=S.bill,base=billCalc(),dur=Math.max(0,Math.round(base.hours*60)),st=toMin(S.start);
  const ids=base.rows.map(x=>x.id),n=ids.length;
  // jam → menit sejak mulai sewa, dijepit ke [0, dur]
  const rel=t=>{const r=((toMin(t)-st)%1440+1440)%1440;if(r<=dur)return r;return (r-dur)>(1440-r)?0:dur};
  const span={};
  ids.forEach(i=>{const sp=B.span[i];let f=sp?rel(sp.from):0,to=sp?rel(sp.to):dur;if(to<f)to=f;span[i]={f,to,part:!!sp&&(f>0||to<dur)}});
  const share={};ids.forEach(i=>share[i]=0);
  let empty=0;
  if(dur>0&&n){
    const pts=[...new Set([0,dur,...ids.flatMap(i=>[span[i].f,span[i].to])])].sort((a,b)=>a-b);
    for(let k=0;k<pts.length-1;k++){
      const a=pts[k],b=pts[k+1],cost=base.court*(b-a)/dur;
      let on=ids.filter(i=>span[i].f<=a&&span[i].to>=b);
      if(!on.length){empty+=b-a;on=ids} // tidak ada yang main: dibagi semua
      on.forEach(i=>share[i]+=cost/on.length);
    }
  }else ids.forEach(i=>share[i]=n?base.court/n:0);
  const kokEach=n?base.kok/n:0;
  const rows=ids.map(i=>{const raw=share[i]+kokEach;return {id:i,court:share[i],kok:kokEach,min:span[i].to-span[i].f,f:span[i].f,to:span[i].to,part:span[i].part,amt:B.round>1?Math.ceil(raw/B.round)*B.round:Math.round(raw)}});
  return {...base,dur,st,rows,empty,collected:rows.reduce((a,r)=>a+r.amt,0)};
}

  </div>`;
  if(r.rows.length){

    const txt=[`🏸 Patungan Bultang Asik, ${day}`,`Lapangan: ${S.courts} × ${+r.hours.toFixed(2)} jam × ${rp(B.courtPrice)} = ${rp(r.court)} (dibagi sesuai jam main)`,`Kok: ${B.kok} × ${rp(B.kokPrice)} = ${rp(r.kok)} (dibagi rata)`,`Total: ${rp(r.total)}`,"",
      ...r.rows.map((x,i)=>`${i+1}. ${nm(x.id)}: ${rp(x.amt)}${x.part?` (${fmt(r.st+x.f)}–${fmt(r.st+x.to)})`:""}${B.paidK[x.id]?" ✅":""}`)].join("\n");
    h+=`<details class="txt"><summary>Lihat teks untuk grup</summary><textarea id="billKText" readonly aria-label="Teks patungan khusus">${esc(txt)}</textarea></details>
      <div class="row">${billBtns("billKText")}${partN?`<button id="allFull">Semua full</button>`:""}<span class="meta copymsg"></span></div>`;
  }
  return h;
}

function mix(hex,a){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,R=25,G=33,Bb=52;return `rgb(${Math.round(R+(r-R)*a)},${Math.round(G+(g-G)*a)},${Math.round(Bb+(b-Bb)*a)})`}

  c.fillStyle="#94A3B8";c.font=`700 28px ${B}`;
  c.fillText(`${day} · ${fmt(toMin(S.start))}–${fmt(toMin(S.end))} WIB`,P,144);
  c.fillText(`${S.games.length} game · ±${S.minutes} menit per game · ${S.players.length} pemain${two?" · 2 lapangan":""}`,P,182);
  // chips
  const chip=(id,x,y)=>{
    let name=nm(id);c.font=`800 30px ${B}`;
    while(c.measureText(name).width>190&&name.length>3)name=name.slice(0,-2)+"…";
    const w=c.measureText(name).width+32,col=colorOf(id);
    c.fillStyle=mix(col,.16);rr(c,x,y,w,46,23);c.fill();
    c.fillStyle=col;c.fillText(name,x+16,y+33);return w;
  };
  let y=headH;
  S.games.forEach((g,i)=>{
    c.fillStyle="#192134";rr(c,P,y,W-2*P,rowH,24);c.fill();
    c.strokeStyle="#2A3448";c.lineWidth=2;c.stroke();
    // nomor + jam
    c.fillStyle="#F97316";c.font=`700 44px ${D}`;c.textAlign="center";c.fillText(String(i+1),P+62,y+(two?78:62));
    c.fillStyle="#94A3B8";c.font=`700 22px ${B}`;c.fillText(gameTime(i),P+62,y+(two?110:94));c.textAlign="left";
    c.fillStyle="#2A3448";c.fillRect(P+122,y+18,3,rowH-36);
    let x0=P+146,yy=y+(two?20:18);
    g.courts.forEach((ct,k)=>{
      let x=x0;
      if(two){c.fillStyle="#94A3B8";c.font=`800 20px ${B}`;c.fillText("L"+(k+1),x,yy+31);x+=40}
      x+=chip(ct.a[0],x,yy)+8;x+=chip(ct.a[1],x,yy)+14;
      c.fillStyle="#94A3B8";c.font=`600 26px ${D}`;c.fillText("vs",x,yy+33);x+=c.measureText("vs").width+14;
      x+=chip(ct.b[0],x,yy)+8;chip(ct.b[1],x,yy);
      yy+=62;
    });
    if(g.rest&&g.rest.length){c.fillStyle="#94A3B8";c.font=`700 24px ${B}`;
      let txt="Istirahat: "+g.rest.map(nm).join(", ");while(c.measureText(txt).width>W-2*P-170&&txt.length>10)txt=txt.slice(0,-2);
      c.fillText(txt,x0,yy+28)}
    y+=rowH+14;
  });
  // ringkasan jumlah main
  const t=tallies();y+=16;
  c.fillStyle="#F8FAFC";c.font=`700 34px ${D}`;c.fillText("Jumlah main",P,y+34);y+=58;
  const cw=(W-2*P-3*12)/4;
  S.players.forEach((p,i)=>{
    const col=COLORS[p.c%COLORS.length],x=P+(i%4)*(cw+12),yy=y+Math.floor(i/4)*70;
    c.fillStyle=mix(col,.12);rr(c,x,yy,cw,58,16);c.fill();
    let name=p.name;c.font=`800 26px ${B}`;while(c.measureText(name+"  "+t[p.id].main+"×").width>cw-24&&name.length>3)name=name.slice(0,-2)+"…";
    c.fillStyle=col;c.fillText(name,x+14,yy+38);
    c.fillStyle="#F8FAFC";c.font=`700 26px ${D}`;c.textAlign="right";c.fillText(t[p.id].main+"×",x+cw-14,yy+38);c.textAlign="left";
  });
  y+=tallyRows*70+24;
  c.fillStyle="#64748B";c.font=`600 22px ${B}`;c.fillText("Dibuat dengan Bultang Asik · "+APP_URL.replace(/^https?:\/\//,"").replace(/\/$/,""),P,y+20);
  COLORS=keepC;
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
  if(imgURL)URL.revokeObjectURL(imgURL);
  imgFile=new File([blob],"tabel-bultang-asik.png",{type:"image/png"});
  imgURL=URL.createObjectURL(blob);imgSig=tableSig();
}
function renderImageCard(){
  if(!imgURL||imgSig!==tableSig())return "";
  const canShare=!!(navigator.canShare&&navigator.canShare({files:[imgFile]}));
  return `<div class="card" id="imgCard"><div class="card-title"><b>${ic("image")}Gambar tabel</b><button id="imgClose">${ic("x")}Tutup</button></div>
    <img src="${imgURL}" alt="Gambar tabel main" class="imgprev">
    <div class="row">${canShare?`<button class="primary" id="imgShare">${ic("share")}Bagikan ke WhatsApp</button>`:""}<a class="btnlink${canShare?"":" primary"}" href="${imgURL}" download="tabel-bultang-asik.png">${ic("download")}Simpan gambar</a></div>
    <p class="note">${canShare?"Pilih WhatsApp lalu grupnya.":"Simpan gambarnya, lalu kirim lewat WhatsApp."}</p></div>`;
}
function render(){
  const ae=document.activeElement,aid=ae&&ae.id&&ae.matches("input")?ae.id:null,aval=aid?ae.value:null;
  const keepName=(document.getElementById("newName")||{}).value||"";
  document.getElementById("exampleBanner").hidden=!S.example;
  document.getElementById("tab-jadwal").innerHTML=renderJadwal();
  document.getElementById("tab-patungan").innerHTML=renderPatungan();
  document.getElementById("tab-khusus").innerHTML=renderKhusus();
  const nn=document.getElementById("newName");if(nn&&keepName)nn.value=keepName;
  if(aid){const el=document.getElementById(aid);if(el){el.value=aval;el.focus({preventScroll:true})}}
  enterGames=false;
  syncWake();
}
function regenerate(){
  // keep games up to the last one ticked as done, rebuild the rest
  let last=-1;S.games.forEach((g,i)=>{if(g.done)last=i});
  const keep=S.games.slice(0,last+1).map(g=>Object.assign({},g,{done:true}));
  S.games=S.players.length>=4?makeGames(S,keep):keep;enterGames=true;
}
function touch(){S.example=false}

/* ---------- interaksi ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab){if(t.dataset.tab!==tab){setTab(t.dataset.tab);haptic()}return}
  if(t.id==="fromContacts"){
    navigator.contacts.select(["name"],{multiple:true}).then(res=>{
      const list=res.map(c=>(c.name||[])[0]).filter(Boolean);if(!list.length)return;
      const r=addPlayers(shortNames(list));render();haptic();
      showToast(r.added?`${r.added} pemain ditambahkan${r.skipped?`, ${r.skipped} dilewati (sudah ada/penuh)`:""}`:"Tidak ada pemain baru (sudah ada atau sudah 8 orang)");
    }).catch(()=>{});
    return;
  }
  if(t.id==="impReplace"||t.id==="impAdd"){
    const names=pendingImport?pendingImport.names:[];pendingImport=null;
    if(t.id==="impReplace"){S.players=[];S.games=[];S.courts=1;S.bill.paid={};S.bill.paidK={};S.bill.span={}}
    const r=addPlayers(names);touch();save();render();haptic();
    showToast(t.id==="impReplace"?`Sesi baru dengan ${S.players.length} pemain`:`${r.added} pemain ditambahkan${r.skipped?`, ${r.skipped} dilewati`:""}`);
    return;
  }
  if(t.id==="impCancel"){pendingImport=null;render();return}
  if(t.id==="wakeBtn"){
    wakeOn=!wakeOn;try{localStorage.setItem(WAKE_KEY,wakeOn?"1":"0")}catch(err){}
    haptic();render();showToast(wakeOn?"Layar tetap menyala di tab Tabel":"Layar boleh mati seperti biasa");return;
  }
  if(t.id==="iosTipClose"){document.getElementById("iosTip").hidden=true;try{localStorage.setItem(TIP_KEY,"1")}catch(err){}return}
  if(t.id==="themeBtn"){const nx=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";try{localStorage.setItem(THEME_KEY,nx)}catch(err){}applyTheme(nx);return}
  if(t.id==="imgMake"){
    t.disabled=true;t.textContent="Membuat gambar…";
    makeImage().then(()=>{render();const el=document.getElementById("imgCard");if(el)el.scrollIntoView({behavior:"smooth",block:"center"})}).catch(()=>{showToast("Gagal membuat gambar");render()});
    return;
  }
  if(t.id==="imgClose"){imgSig="";render();return}
  if(t.id==="imgShare"){
    navigator.share({files:[imgFile],title:"Tabel main Bultang Asik"}).catch(err=>{if(err&&err.name!=="AbortError")showToast("Tidak bisa membagikan, pakai Simpan gambar")});
    return;
  }
  if(t.dataset.share){
    const ta=document.getElementById(t.dataset.share);if(!ta)return;
    navigator.share({text:ta.value}).then(()=>haptic()).catch(err=>{
      if(err&&err.name==="AbortError")return; // pengguna menutup share sheet
      try{navigator.clipboard.writeText(ta.value).then(()=>showToast("Tidak bisa membagikan, teks sudah disalin"),()=>showToast("Tidak bisa membagikan"))}catch(e2){showToast("Tidak bisa membagikan")}
    });
    return;
  }
  if(t.dataset.copy){
    const ta=document.getElementById(t.dataset.copy),msg=t.parentElement.querySelector(".copymsg");
    const fb=()=>{const d=ta.closest("details");if(d)d.open=true;ta.focus();ta.select();msg.textContent="Teks sudah dipilih, salin manual."};
    try{navigator.clipboard.writeText(ta.value).then(()=>{msg.textContent="Tersalin ✓";showToast("Tersalin, tinggal tempel di WhatsApp")},fb)}catch(err){fb()}
    return;
  }
  if(t.dataset.del){S.players=S.players.filter(p=>p.id!==t.dataset.del);if(S.players.length<8)S.courts=1;touch();regenerate();haptic()}
  else if(t.dataset.courts){if(S.courts===+t.dataset.courts)return;S.courts=+t.dataset.courts;touch();regenerate()}
  else if(t.id==="gen"){touch();regenerate();haptic();showToast("Susunan baru dibuat")}
  else if(t.dataset.done){const g=S.games[+t.dataset.done];g.done=!g.done;touch();haptic()}
  else if(t.dataset.kok){const nk=Math.max(0,S.bill.kok+ +t.dataset.kok);if(nk!==S.bill.kok)haptic();S.bill.kok=nk;touch()}
  else if(t.dataset.mode){S.bill.mode=t.dataset.mode;touch()}
  else if(t.dataset.round){S.bill.round=+t.dataset.round;touch()}
  else if(t.id==="hoursAuto"){S.bill.hours=null;touch()}
  else if(t.dataset.full){delete S.bill.span[t.dataset.full];touch()}
  else if(t.id==="allFull"){S.bill.span={};touch()}
  else return;
  save();render();
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const inp=document.getElementById("newName");const v=(inp.value||"").trim();if(!v)return;
  if(S.players.length>=8)return;
  if(S.players.some(p=>p.name.toLowerCase()===v.toLowerCase())){showToast("Nama itu sudah ada");return}
  const used=new Set(S.players.map(p=>p.c));let c=0;while(used.has(c)&&c<8)c++;
  const p={id:uid(),name:v,c};S.players.push(p);S.names[p.id]=v;inp.value="";touch();regenerate();save();render();
  const n2=document.getElementById("newName");if(n2)n2.focus();
});
document.addEventListener("change",e=>{
  const s=e.target;
  // di iOS, toggle switch bawaan sudah bergetar sendiri
  if(s.dataset.paid){if(s.checked)S.bill.paid[s.dataset.paid]=true;else delete S.bill.paid[s.dataset.paid];if(!IS_IOS)haptic();touch();save();render()}
  if(s.dataset.paidk){if(s.checked)S.bill.paidK[s.dataset.paidk]=true;else delete S.bill.paidK[s.dataset.paidk];if(!IS_IOS)haptic();touch();save();render()}
  if(s.dataset.span){
    if(!s.value)return;
    const id=s.dataset.sid,r=billKhusus(),x=r.rows.find(y=>y.id===id);if(!x)return;
    const sp={from:hm(r.st+x.f),to:hm(r.st+x.to)};sp[s.dataset.span]=s.value;
    if(sp.from===hm(r.st)&&sp.to===hm(r.st+r.dur))delete S.bill.span[id];else S.bill.span[id]=sp;
    touch();save();render();return;
  }
  if(s.dataset.f){regenerate();save();render();return}
  if(s.dataset.b)render();
});
document.addEventListener("input",e=>{
  const s=e.target;
  if(s.dataset.f){
    const k=s.dataset.f;if(k==="minutes"){const v=parseInt(s.value,10);if(!(v>=5&&v<=40))return;S.minutes=v}else{if(!s.value)return;S[k]=s.value}
    touch();save();
    const plan=document.getElementById("plan");if(plan){const tmp=document.createElement("div");tmp.innerHTML=renderJadwal();const np=tmp.querySelector("#plan");if(np)plan.innerHTML=np.innerHTML}
    return;
  }
  if(s.dataset.b){const v=parseFloat(s.value);S.bill[s.dataset.b]=isNaN(v)||v<0?0:v;touch();save()}
});

/* ---------- pindah tab ---------- */
function setTab(name){
  tab=name;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===name));
  document.getElementById("tabs").style.setProperty("--i",TABS.indexOf(name));
  TABS.forEach(n=>{const s=document.getElementById("tab-"+n);s.hidden=n!==tab;if(n===tab){s.classList.remove("enter");void s.offsetWidth;s.classList.add("enter");setTimeout(()=>s.classList.remove("enter"),600)}});
  window.scrollTo(0,0);
  syncWake();
}

/* ---------- getar halus ----------
   Android: navigator.vibrate. iOS 18+: Safari tidak punya vibrate, tapi menggeser
   <input type="checkbox" switch> memicu haptic bawaan. Kita klik label switch tersembunyi. */
let hapEl=null;
function haptic(){
  try{
    if(navigator.vibrate){navigator.vibrate(12);return}
    if(!IS_IOS)return;
    if(!hapEl){
      hapEl=document.createElement("label");hapEl.setAttribute("aria-hidden","true");
      hapEl.style.cssText="position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none";
      const i=document.createElement("input");i.type="checkbox";i.setAttribute("switch","");i.tabIndex=-1;
      hapEl.appendChild(i);document.body.appendChild(hapEl);
    }
    hapEl.click();
  }catch(e){}
}

/* ---------- gestur geser ----------
   Geser kartu game ke kanan = tandai selesai (atau batalkan). Geser kiri/kanan di tempat
   lain = pindah tab. Sentuhan dari tepi layar diabaikan supaya gestur "kembali" iOS tetap jalan. */
const SWIPE_DONE=90,SWIPE_TAB=70;
let sw=null;
function swipeReset(s){if(s&&s.game){s.game.style.transition="";s.game.style.transform="";s.game.parentElement.classList.remove("swiping","armed")}}
document.addEventListener("touchstart",e=>{
  if(e.touches.length!==1){swipeReset(sw);sw=null;return}
  const p=e.touches[0],tg=e.target;
  if(tg.closest("input,textarea,label.f,.mx-wrap,.tabbar,.seg,.imgprev")){sw=null;return}
  sw={x:p.clientX,y:p.clientY,dx:0,dir:null,armed:false,game:tg.closest(".game"),edge:p.clientX<24||p.clientX>window.innerWidth-24};
},{passive:true});
document.addEventListener("touchmove",e=>{
  if(!sw)return;
  const p=e.touches[0],dx=p.clientX-sw.x,dy=p.clientY-sw.y;
  if(!sw.dir){if(Math.abs(dx)<10&&Math.abs(dy)<10)return;sw.dir=Math.abs(dx)>Math.abs(dy)*1.3?"h":"v"}
  if(sw.dir!=="h")return;
  sw.dx=dx;
  if(sw.game){
    const d=Math.max(0,Math.min(dx,140)),w=sw.game.parentElement;
    sw.game.style.transition="none";sw.game.style.transform=`translateX(${d}px)`;
    w.classList.toggle("swiping",d>0);
    const arm=d>=SWIPE_DONE;if(arm!==sw.armed){sw.armed=arm;w.classList.toggle("armed",arm)}
  }
},{passive:true});
document.addEventListener("touchend",()=>{
  if(!sw)return;const s=sw;sw=null;swipeReset(s);
  if(s.dir!=="h")return;
  if(s.game&&s.dx>=SWIPE_DONE){
    const i=+s.game.dataset.i,g=S.games[i];if(!g)return;
    g.done=!g.done;touch();haptic();save();render();
    showToast(g.done?`Game ${i+1} selesai`:`Game ${i+1} batal selesai`);return;
  }
  if(s.game&&s.dx>0)return;
  if(!s.edge&&Math.abs(s.dx)>=SWIPE_TAB){
    const i=TABS.indexOf(tab)+(s.dx<0?1:-1);
    if(i>=0&&i<TABS.length){setTab(TABS[i]);haptic()}
  }
},{passive:true});
document.addEventListener("touchcancel",()=>{swipeReset(sw);sw=null},{passive:true});

/* ---------- tema ---------- */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme",t);
  const b=document.getElementById("themeBtn");if(b)b.innerHTML=ic(t==="dark"?"sun":"moon");
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="dark"?"#0F172A":"#FFF7ED";
  COLORS=t==="dark"?COLORS_DARK:COLORS_LIGHT;
  if(typeof S!=="undefined"&&S)render();
}
(function(){let t=null;try{t=localStorage.getItem(THEME_KEY)}catch(e){}applyTheme(t==="light"?"light":"dark")})();

if(!S)S=sample();
(function(){let seen=null;try{seen=localStorage.getItem(TIP_KEY)}catch(e){}if(IS_IOS&&!STANDALONE&&!seen)document.getElementById("iosTip").hidden=false})();
// buka dari pintasan ikon (?tab=, ?aksi=kok) atau dari share WhatsApp (?text=)
(function(){
  const q=new URLSearchParams(location.search);
  const shared=[q.get("title"),q.get("text")].filter(Boolean).join("\n");
  if(shared)pendingImport={names:parseNames(shared)};
  if(q.get("aksi")==="kok")pendingKok=true;
  if(q.toString())try{history.replaceState(null,"",location.pathname)}catch(e){}
  const t=q.get("tab")||(pendingKok?"patungan":null);
  render();
  if(t&&TABS.includes(t)&&t!=="jadwal")setTab(t);
})();
document.getElementById("tab-jadwal").classList.add("enter");
startSync();
</script>
